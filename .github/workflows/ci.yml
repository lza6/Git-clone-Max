# See https://docs.github.com/en/actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# G78：并发组 + cancel-in-progress。
# 事故背景（2026-10-23）：两个会话在同一分支连续推了 5 个提交，而本 workflow 没有 concurrency
# 配置 → 5 个 run × 7 个 job = 35 个 job 同时抢并发，队列 57 分钟零派发（此前每个 run 约 5.5 分钟）。
# 加同组互斥后：同一分支只保留最新的一个 run，旧 run 被自动取消 —— 既不浪费 runner 分钟，
# 也让"最新提交的结论"及时出来（这才是 review 真正需要的那个结论）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# G45-7：三平台矩阵（Windows/Linux/macOS）+ 独立真实 git E2E 冒烟 job。
# GitHub hosted runner 均自带 git，无需额外安装。
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    # G76：这里曾有一个 job 级 `COVERAGE_FAIL_UNDER: 84`，但**从未生效** ——
    # 覆盖率那一步（"Coverage gate"）自带步骤级 env（Windows 81 / POSIX 80），
    # 步骤级完全覆盖 job 级。死值会误导 review，也可能在某天有人删掉步骤级 env 时
    # 静默把门禁变成 84。故删除，唯一生效点保留在步骤级。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6==6.11.0 coverage==7.16.0
          python -m pip install -r requirements-build.txt

      # G50-3 Linux runner 缺 Qt 系统库（libEGL.so.1 等）→ 装最小离屏运行依赖
      - name: Install Qt system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 libxcb-cursor0

      # Windows：system 级 identity + autocrlf=true（保持原行为）
      - name: Setup git identity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system user.email "ci@example.com"
          git config --system user.name "CI"
          git config --system core.autocrlf true

      # Linux/macOS：global 级 identity（runner 无 /etc 写权限，system 级不可用）
      - name: Setup git identity (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # G59-5：主矩阵只跑非慢集（快集 = 全量 - 慢集黑名单）；
      # 慢集（真实 git E2E）由下方独立 slow job 承接，避免全量阻塞快速反馈。
      - name: Run tests (offscreen, fast suite)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m coverage run --source=gcm scripts/ci_run_fast.py

      # G29-1 覆盖率门禁：不达标 CI 变红。阈值来自 job env COVERAGE_FAIL_UNDER。
      # G59-5：主矩阵 coverage 基于「快集」实测基线（本机 81%；Windows 81 / POSIX 80，
      # 差值源于 Windows 专属分支 msvcrt/schtasks/startfile/winreg 在 POSIX 不可执行）。
      # 慢集（真实 git E2E）由 slow job 独立承接，不计入主矩阵门禁。
      - name: Coverage gate (fast suite)
        env:
          COVERAGE_FAIL_UNDER: ${{ runner.os == 'Windows' && 81 || 80 }}
        run: |
          python -m coverage report --fail-under=${{ env.COVERAGE_FAIL_UNDER }}

      # G29-2 ruff 静态检查：零 error
      - name: Install ruff
        run: |
          python -m pip install ruff
      - name: Lint (ruff)
        run: |
          ruff check gcm --output-format=github

      # M7 收官：mypy 类型门禁（本地已 0 error，纳入矩阵防回归）
      - name: Type check (mypy)
        run: |
          python -m pip install mypy
          mypy gcm

      # G29-6 模块级覆盖率表格输出到 job summary（pwsh 三平台预装）
      # G66-5 修复：原实现写到 Path.home() 而 upload-artifact 取工作区相对路径
      # `.workflow_summary.md` → 三平台永远上传不到（静默空产物）。改为写工作区根。
      # G66-15 修正：不再用 if-no-files-found: error —— 这个 summary 只是**信息性产物**，
      # 真正的门禁是上一步的覆盖率阈值；为它把 job 弄红是过度反应（且会淹没真实失败）。
      # 但「静默缺失」本身是要避免的，所以在步骤内**显式打印文件是否存在与大小**，
      # 让它出现在日志里可诊断；artifact 缺失降级为警告。
      # G69-18：本步骤是**信息性**的（真正的门禁是上一步的覆盖率阈值），
      # 却因为脚本自身把中文写进 cp1252 控制台而 `UnicodeEncodeError` → 把 job 弄红。
      # 两处修正：① 脚本内显式 reconfigure 为 UTF-8（与 gcm/cli.py 同款做法）；
      # ② 整步 continue-on-error —— 信息性步骤不该有能力弄红 job。
      - name: Coverage summary
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -m coverage json
          @"
          import json
          import os
          import sys
          # Windows runner 控制台是 cp1252，本脚本要打印中文 → 显式改 UTF-8，
          # 无法编码的字符降级替换而不是抛异常。
          for _s in (sys.stdout, sys.stderr):
              try:
                  _s.reconfigure(encoding="utf-8", errors="replace")
              except Exception:
                  pass
          with open("coverage.json", encoding="utf-8") as f:
              data = json.load(f)
          total = data["totals"]["percent_covered"]
          lines = ["### 模块级覆盖率", "", "| 模块 | 覆盖率 |", "|------|--------|"]
          for name, meta in sorted(data["files"].items()):
              lines.append(f"| {name} | {meta['summary']['percent_covered']:.1f}% |")
          lines.append(f"| **TOTAL** | **{total:.1f}%** |")
          with open(".workflow_summary.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          print("[coverage-summary] 已写入 .workflow_summary.md，大小",
                os.path.getsize(".workflow_summary.md"), "字节")
          "@ | python -

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          # 矩阵并行 job 必须唯一 artifact 名，避免 upload-artifact@v4 冲突
          name: workflow-summary-${{ matrix.os }}
          path: .workflow_summary.md
          # 信息性产物：缺失只在日志里可见，不把 job 弄红（门禁看覆盖率阈值步骤）
          if-no-files-found: warn

  # G45-7：真实 git E2E 冒烟（本地裸仓 clone/update/conflict 保护），独立红绿灯
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run git E2E smoke
        run: |
          python scripts/e2e_smoke.py

  # G55-1 提速扩展：快速单元测试 job（纯逻辑/G52-G58 轻量测试，不跑重 git E2E）。
  # 独立红绿灯，不阻塞主矩阵；主矩阵仍跑全量 coverage 门禁。
  fast-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6==6.11.0

      - name: Install Qt system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 libxcb-cursor0

      - name: Run fast tests (G53/G54/G57/G58/QSS/redact/reports)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest tests.test_redact tests.test_reports tests.test_reports2 \
            tests.test_g53_scorecards tests.test_g53_reports tests.test_g53_extra \
            tests.test_g54_ux tests.test_g57_responsive tests.test_g58_network \
            tests.test_qss_validate tests.test_qss_validate_extra

  # G69-18：硬件敏感测试独立 job。
  # `test_scanner_perf`（含绝对时间断言 assertLess(elapsed, 30)）与
  # `test_mem_baseline`（真实跑引擎测 tracemalloc 峰值）依赖 runner 机器性能，
  # 放在主矩阵的覆盖率门禁里会造成「本机绿、CI 红」的不可复现红灯 ——
  # 门禁该判定代码对不对，不是 CI 机器多快。移到这里独立红绿灯：
  # 断言一条没削弱，只是不再拿它当正确性门禁。
  perf-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6==6.11.0

      - name: Install Qt system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 libxcb-cursor0

      - name: Run hardware-sensitive tests (perf / mem baseline)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest tests.test_scanner_perf tests.test_mem_baseline

  # G59-5：慢测独立 job（真实 git E2E：engine/v7/core/extra/v3_p0/submodule 等），
  # 主矩阵只跑非慢集；慢 job 独立红绿灯，避免全量阻塞快速反馈。
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6==6.11.0 coverage==7.16.0
          python -m pip install -r requirements-build.txt

      - name: Install Qt system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1 libxcb-cursor0

      - name: Setup git identity (Linux)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run slow tests (real git E2E)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest tests.test_engine tests.test_v7_fixes tests.test_core \
            tests.test_extra tests.test_v3_p0 tests.test_submodule tests.test_publish \
            tests.test_scanner tests.test_tag_branch tests.test_progress_search
